[project]
name = "collective-agreements-rag"
version = "0.1.0"
description = "RAG application for querying collective labor agreements"
requires-python = ">=3.12"

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "faiss-cpu",
    "beautifulsoup4",
    "pypdf",
    "python-docx",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["data*", "tests*"]