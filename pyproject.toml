
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "collective-agreements-rag"
version = "0.1.0"
description = "RAG API for querying Brazilian collective labor agreements"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "python-dotenv",
    "python-multipart",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langchain-text-splitters",
    "beautifulsoup4",
    "pypdf",
    "python-docx",
    "minio>=7.2,<8",
    "qdrant-client==1.15.1",
    "langchain-qdrant",
]

[tool.setuptools.packages.find]
include = ["app*"]
